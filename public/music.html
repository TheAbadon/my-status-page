<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Âm nhạc của tôi</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: rgba(255,255,255,0.7);
            --text: #1a1a2e;
            --sub: #555;
            --accent: #4f46e5;
            --accent2: #7c3aed;
            --border: rgba(255,255,255,0.6);
            --shadow: 0 8px 40px rgba(0,0,0,0.08);
            --radius: 24px;
            --transition: 0.3s ease;
        }
        body.dark {
            --bg: #0a0a14;
            --card: rgba(20,25,40,0.7);
            --text: #f9fafb;
            --sub: #9ca3af;
            --border: rgba(255,255,255,0.15);
            --shadow: 0 8px 40px rgba(0,0,0,0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            transition: background var(--transition), color var(--transition);
            background-image: radial-gradient(ellipse at top, #e0e7ff 0%, var(--bg) 60%);
        }
        body.dark {
            background-image: radial-gradient(ellipse at top, #1e1b4b 0%, var(--bg) 60%);
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 50px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all var(--transition);
            z-index: 100;
        }
        .back-link:hover {
            transform: translateX(-4px);
            background: var(--accent);
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 30px;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .header p { color: var(--sub); font-size: 0.95rem; }

        .song-list {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .song-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: slideIn 0.6s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .song-card:nth-child(1) { animation-delay: 0.1s; }
        .song-card:nth-child(2) { animation-delay: 0.2s; }
        .song-card:nth-child(3) { animation-delay: 0.3s; }
        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .song-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 0;
        }
        .song-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(79, 70, 229, 0.3);
            border-color: var(--accent);
        }
        .song-card:hover::before { opacity: 0.08; }
        .song-card:hover .song-info h3 { color: var(--accent); }
        .song-card:hover .play-icon {
            transform: scale(1.1);
            background: var(--accent);
            color: white;
        }

        .song-cover {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .song-cover.spin::after {
            content: '';
            position: absolute;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.4);
            animation: spin 8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .song-info { flex: 1; z-index: 1; }
        .song-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            transition: color 0.3s;
        }
        .song-info p { font-size: 0.8rem; color: var(--sub); }

        .play-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s;
            flex-shrink: 0;
            z-index: 1;
        }

        .equalizer {
            display: none;
            gap: 3px;
            align-items: flex-end;
            height: 20px;
            margin-left: 8px;
        }
        .song-card:hover .equalizer { display: flex; }
        .equalizer span {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }
        .equalizer span:nth-child(1) { height: 8px; animation-delay: 0s; }
        .equalizer span:nth-child(2) { height: 16px; animation-delay: 0.1s; }
        .equalizer span:nth-child(3) { height: 10px; animation-delay: 0.2s; }
        .equalizer span:nth-child(4) { height: 18px; animation-delay: 0.3s; }
        .equalizer span:nth-child(5) { height: 6px; animation-delay: 0.4s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.2); }
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: all var(--transition);
            z-index: 100;
        }
        .theme-toggle:hover { transform: scale(1.1); }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.6rem; }
            .song-card { padding: 12px 16px; gap: 12px; }
            .song-cover { width: 52px; height: 52px; font-size: 1.4rem; }
            .song-info h3 { font-size: 1rem; }
            .play-icon { width: 38px; height: 38px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Quay lại</a>
    <div class="theme-toggle" id="themeToggle" title="Chuyển chế độ sáng/tối">🌙</div>

    <div class="header">
        <h1>🎵 Âm nhạc của tôi</h1>
        <p>Những bài hát tôi yêu thích</p>
    </div>

    <div class="song-list">
        <a href="https://youtu.be/PeitgWu6Yj8?si=x6cFxGeM_xBab-es" target="_blank" rel="noopener noreferrer" class="song-card">
            <div class="song-cover spin">🎵</div>
            <div class="song-info">
                <h3>GREATEST</h3>
                <p>YouTube • Nhấn để nghe</p>
            </div>
            <div class="equalizer"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="play-icon">▶</div>
        </a>

        <a href="https://youtu.be/_xwOiIMM2a4?si=Upmc1b2M8SVLKQWN" target="_blank" rel="noopener noreferrer" class="song-card">
            <div class="song-cover spin">🎶</div>
            <div class="song-info">
                <h3>You & Aizu</h3>
                <p>YouTube • Nhấn để nghe</p>
            </div>
            <div class="equalizer"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="play-icon">▶</div>
        </a>

        <a href="https://youtu.be/LjuKylF4udw?si=ou5wn1Wmn9507FYg" target="_blank" rel="noopener noreferrer" class="song-card">
            <div class="song-cover spin">🎧</div>
            <div class="song-info">
                <h3>Aishikake</h3>
                <p>YouTube • Nhấn để nghe</p>
            </div>
            <div class="equalizer"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="play-icon">▶</div>
        </a>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            body.classList.add('dark');
            themeToggle.textContent = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            const isDark = body.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>
</html>
